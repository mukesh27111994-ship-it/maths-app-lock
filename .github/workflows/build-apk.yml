name: Build Maths App Lock APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Kids V3 Bank-Safe Project & Release Certificate
        run: |
          rm -rf app/src/main/res/xml/accessibility_service.xml
          mkdir -p app/src/main/java/com/example/mathlock
          mkdir -p app/src/main/res/values

          # Generate Official Release Signing Keystore (.jks Certificate)
          rm -f app/release-key.jks
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias mathlock \
            -storepass MathLock123 \
            -keypass MathLock123 \
            -dname "CN=MathsAppLock, OU=KidsApp, O=MathsLock, L=Surat, S=Gujarat, C=IN"

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'MathsAppLock'
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
           namespace 'com.example.mathlock'
           compileSdk 35
           defaultConfig {
            applicationId 'com.example.mathlock'
            minSdk 24
            targetSdk 28
            versionCode 4
            versionName '3.1-BankSafe'
           }
           signingConfigs {
            release {
             storeFile file('release-key.jks')
             storePassword 'MathLock123'
             keyAlias 'mathlock'
             keyPassword 'MathLock123'
            }
           }
           buildTypes {
            release {
             signingConfig signingConfigs.release
             minifyEnabled false
             debuggable false
            }
           }
           compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
           }
           lint {
            checkReleaseBuilds false
            abortOnError false
           }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
           <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
           <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
           <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
           <uses-permission android:name="android.permission.VIBRATE"/>
           <queries>
            <intent>
             <action android:name="android.intent.action.MAIN"/>
             <category android:name="android.intent.category.LAUNCHER"/>
            </intent>
           </queries>
           <application
            android:allowBackup="false"
            android:label="Maths App Lock"
            android:theme="@android:style/Theme.Material.Light.NoActionBar"
            android:usesCleartextTraffic="false">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
            <activity
             android:name=".ChallengeActivity"
             android:exported="false"
             android:excludeFromRecents="true"
             android:launchMode="singleTop" />
            <service
             android:name=".LockService"
             android:exported="false" />
           </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
           <string name="app_name">Maths App Lock</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mathlock/LockService.java
          package com.example.mathlock;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.util.HashMap;

          public class LockService extends Service {
              static final HashMap<String, Long> unlocked = new HashMap<>();
              static String currentTarget = null, previous = "";
              static boolean challengeVisible = false;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable checkRunnable = new Runnable() {
                  @Override
                  public void run() {
                      checkForegroundApp();
                      handler.postDelayed(this, 350);
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();
                  startForegroundNotification();
                  handler.post(checkRunnable);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              private void startForegroundNotification() {
                  String channelId = "kids_math_lock_channel";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel channel = new NotificationChannel(
                              channelId,
                              "Kids Maths Lock Protection",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      nm.createNotificationChannel(channel);
                  }
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(
                          this, 0, openIntent,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0
                  );
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, channelId)
                          : new Notification.Builder(this);
                  Notification notification = builder
                          .setContentTitle("🦁 Kids Maths App Lock")
                          .setContentText("Kids learning protection is active")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                  startForeground(101, notification);
              }

              private void checkForegroundApp() {
                  SharedPreferences p = getSharedPreferences("lock", MODE_PRIVATE);
                  if (!p.getBoolean("enabled", true)) return;
                  if (challengeVisible) return;

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null && !pm.isInteractive()) return;

                  UsageStatsManager usm = (UsageStatsManager) getSystemService(Context.USAGE_STATS_SERVICE);
                  if (usm == null) return;

                  long now = System.currentTimeMillis();
                  UsageEvents events = usm.queryEvents(now - 10000, now);
                  if (events == null) return;

                  UsageEvents.Event event = new UsageEvents.Event();
                  String topPkg = null;
                  while (events.hasNextEvent()) {
                      events.getNextEvent(event);
                      if (event.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                          topPkg = event.getPackageName();
                      }
                  }

                  if (topPkg == null || topPkg.isEmpty()) return;
                  if (topPkg.equals(getPackageName()) ||
                      topPkg.equals("com.android.systemui") ||
                      topPkg.equals("com.android.settings") ||
                      topPkg.contains("incallui") ||
                      topPkg.contains("dialer") ||
                      topPkg.contains("permissioncontroller")) {
                      return;
                  }

                  if (!topPkg.equals(previous) && previous.length() > 0) {
                      if (p.getInt("delay", 0) == 0) {
                          unlocked.remove(previous);
                      }
                  }
                  previous = topPkg;

                  if (!p.getBoolean("app_" + topPkg, false)) return;

                  Long until = unlocked.get(topPkg);
                  if (until != null && (until == Long.MAX_VALUE || SystemClock.elapsedRealtime() < until)) {
                      return;
                  }

                  currentTarget = topPkg;
                  challengeVisible = true;
                  Intent i = new Intent(this, ChallengeActivity.class)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK |
                                    Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS |
                                    Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  i.putExtra("locked_package", topPkg);
                  try {
                      startActivity(i);
                  } catch (RuntimeException ex) {
                      challengeVisible = false;
                  }
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(checkRunnable);
                  challengeVisible = false;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mathlock/MainActivity.java
          package com.example.mathlock;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.AppOpsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
              SharedPreferences prefs;
              LinearLayout root, apps;
              TextView status, starsBadge;
              Button usageBtn, overlayBtn;
              private int secretTapCount = 0;
              private long lastTapTime = 0L;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("lock", MODE_PRIVATE);
                  show();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  boolean hasUsage = hasUsageStatsPermission();
                  boolean hasOverlay = hasOverlayPermission();

                  if (status != null) {
                      if (hasUsage && hasOverlay) {
                          status.setText("✅ Bank-Safe Protection: ON & Ready!");
                          status.setTextColor(Color.parseColor("#15803D"));
                          if (prefs.getBoolean("enabled", true)) {
                              startLockService();
                          }
                      } else {
                          status.setText("⚠️ Enable the 2 Bank-Safe permissions below:");
                          status.setTextColor(Color.parseColor("#B45309"));
                      }
                  }
                  if (usageBtn != null) {
                      usageBtn.setText(hasUsage ? "✅ 1. Usage Access: ENABLED" : "1. ENABLE USAGE ACCESS (BANK-SAFE)");
                      usageBtn.setBackground(makeRoundedBg(hasUsage ? "#16A34A" : "#4F46E5", hasUsage ? "#15803D" : "#3730A3", 16, 2));
                  }
                  if (overlayBtn != null) {
                      overlayBtn.setText(hasOverlay ? "✅ 2. Appear on Top: ENABLED" : "2. ENABLE APPEAR ON TOP");
                      overlayBtn.setBackground(makeRoundedBg(hasOverlay ? "#16A34A" : "#7C3AED", hasOverlay ? "#15803D" : "#5B21B6", 16, 2));
                  }
                  updateStarsBadge();
              }

              private void updateStarsBadge() {
                  if (starsBadge != null) {
                      starsBadge.setText("⭐ Total Stars Won: " + prefs.getInt("kids_stars", 0) + " 🌟");
                  }
              }

              private void onSecretTitleTap() {
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastTapTime > 1500) {
                      secretTapCount = 1;
                  } else {
                      secretTapCount++;
                  }
                  lastTapTime = now;

                  if (secretTapCount >= 5) {
                      secretTapCount = 0;
                      showParentPinDialog();
                  }
              }

              private void showParentPinDialog() {
                  final EditText pinInput = new EditText(this);
                  pinInput.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  pinInput.setHint("Enter Parent PIN");

                  new AlertDialog.Builder(this)
                          .setTitle("🔒 Parent Verification")
                          .setMessage("Enter Parent Secret PIN to manage stars:")
                          .setView(pinInput)
                          .setPositiveButton("Next", (d, w) -> {
                              String entered = pinInput.getText().toString().trim();
                              if ("2580".equals(entered)) {
                                  showRestoreStarsDialog();
                              } else {
                                  Toast.makeText(MainActivity.this, "Incorrect Parent PIN!", Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void showRestoreStarsDialog() {
                  final EditText input = new EditText(this);
                  input.setInputType(InputType.TYPE_CLASS_NUMBER);
                  input.setText(String.valueOf(prefs.getInt("kids_stars", 0)));
                  input.setSelection(input.getText().length());

                  new AlertDialog.Builder(this)
                          .setTitle("⭐ Restore Kids Stars")
                          .setMessage("Enter the total stars to set:")
                          .setView(input)
                          .setPositiveButton("Save Stars", (d, w) -> {
                              try {
                                  int val = Integer.parseInt(input.getText().toString().trim());
                                  prefs.edit().putInt("kids_stars", Math.max(0, val)).apply();
                                  updateStarsBadge();
                              } catch (NumberFormatException ignored) {}
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void startLockService() {
                  Intent svc = new Intent(this, LockService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(svc);
                  } else {
                      startService(svc);
                  }
              }

              private boolean hasUsageStatsPermission() {
                  AppOpsManager appOps = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                  if (appOps == null) return false;
                  int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), getPackageName());
                  return mode == AppOpsManager.MODE_ALLOWED;
              }

              private boolean hasOverlayPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      return Settings.canDrawOverlays(this);
                  }
                  return true;
              }

              TextView label(String text, int size, String hexColor) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, size);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setTextColor(Color.parseColor(hexColor));
                  t.setPadding(0, dp(12), 0, dp(6));
                  return t;
              }

              void show() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#FFF8E7"));
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(18);
                  root.setPadding(pad, pad, pad, pad);
                  scroll.addView(root);
                  setContentView(scroll);

                  // Secret 5-Tap Trigger on Title
                  TextView titleView = label("🦁 Kids Maths App Lock", 26, "#312E81");
                  titleView.setOnClickListener(v -> onSecretTitleTap());
                  root.addView(titleView);

                  starsBadge = label("", 16, "#D97706");
                  updateStarsBadge();
                  root.addView(starsBadge);

                  status = label("", 15, "#B45309");
                  root.addView(status);

                  usageBtn = new Button(this);
                  usageBtn.setTextColor(Color.WHITE);
                  usageBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  LinearLayout.LayoutParams btnLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  btnLp.bottomMargin = dp(8);
                  usageBtn.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)));
                  root.addView(usageBtn, btnLp);

                  overlayBtn = new Button(this);
                  overlayBtn.setTextColor(Color.WHITE);
                  overlayBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  overlayBtn.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  });
                  root.addView(overlayBtn, btnLp);

                  Switch enabled = new Switch(this);
                  enabled.setText("Protection enabled");
                  enabled.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17);
                  enabled.setTypeface(Typeface.DEFAULT_BOLD);
                  enabled.setTextColor(Color.parseColor("#1E293B"));
                  enabled.setChecked(prefs.getBoolean("enabled", true));
                  enabled.setPadding(0, dp(14), 0, dp(10));
                  root.addView(enabled);
                  enabled.setOnCheckedChangeListener((b, on) -> {
                      prefs.edit().putBoolean("enabled", on).apply();
                      if (on && hasUsageStatsPermission() && hasOverlayPermission()) {
                          startLockService();
                      } else if (!on) {
                          stopService(new Intent(MainActivity.this, LockService.class));
                      }
                  });

                  root.addView(label("Multiplication tables (Kids Level)", 18, "#1E293B"));
                  Spinner range = new Spinner(this);
                  String[] ranges = {"1 to 3 (5-6 Yrs Beginner 🌱)", "1 to 5 (Kids Easy ⭐)", "2 to 5 (Kids Fun 🎈)", "2 to 10 (Standard 🏆)", "2 to 12 (Clever 🚀)", "2 to 20 (Master 👑)"};
                  int[][] minMax = {{1, 3}, {1, 5}, {2, 5}, {2, 10}, {2, 12}, {2, 20}};
                  range.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, ranges));
                  int savedMin = prefs.getInt("min", 1), savedMax = prefs.getInt("max", 5), selIdx = 1;
                  for (int i = 0; i < minMax.length; i++) {
                      if (minMax[i][0] == savedMin && minMax[i][1] == savedMax) { selIdx = i; break; }
                  }
                  range.setSelection(selIdx);
                  root.addView(range);
                  range.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      public void onNothingSelected(AdapterView<?> p) {}
                      public void onItemSelected(AdapterView<?> p, View v, int i, long id) {
                          prefs.edit().putInt("min", minMax[i][0]).putInt("max", minMax[i][1]).apply();
                      }
                  });

                  root.addView(label("Ask again", 18, "#1E293B"));
                  Spinner delay = new Spinner(this);
                  String[] delays = {"Every time I leave the app", "After 1 minute", "After 5 minutes", "After 15 minutes"};
                  delay.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, delays));
                  int m = prefs.getInt("delay", 0);
                  delay.setSelection(m == 1 ? 1 : m == 5 ? 2 : m == 15 ? 3 : 0);
                  root.addView(delay);
                  delay.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      public void onNothingSelected(AdapterView<?> p) {}
                      public void onItemSelected(AdapterView<?> p, View v, int i, long id) {
                          prefs.edit().putInt("delay", new int[]{0, 1, 5, 15}[i]).apply();
                          LockService.unlocked.clear();
                      }
                  });

                  Button previewBtn = new Button(this);
                  previewBtn.setText("🎨 Preview Cute Kids Lock Screen");
                  previewBtn.setAllCaps(false);
                  previewBtn.setTextColor(Color.WHITE);
                  previewBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  previewBtn.setBackground(makeRoundedBg("#10B981", "#059669", 16, 2));
                  LinearLayout.LayoutParams prevLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  prevLp.topMargin = dp(14);
                  prevLp.bottomMargin = dp(8);
                  previewBtn.setOnClickListener(v -> {
                      LockService.currentTarget = "preview";
                      Intent i = new Intent(MainActivity.this, ChallengeActivity.class);
                      i.putExtra("locked_package", "preview");
                      startActivity(i);
                  });
                  root.addView(previewBtn, prevLp);

                  root.addView(label("3. Select apps to protect", 20, "#312E81"));
                  apps = new LinearLayout(this);
                  apps.setOrientation(LinearLayout.VERTICAL);
                  root.addView(apps);
                  loadApps();
                  onResume();
              }

              void loadApps() {
                  PackageManager pm = getPackageManager();
                  Intent intent = new Intent(Intent.ACTION_MAIN);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> list = pm.queryIntentActivities(intent, 0);
                  Collections.sort(list, (a, b) -> a.loadLabel(pm).toString().compareToIgnoreCase(b.loadLabel(pm).toString()));
                  Set<String> seen = new HashSet<>();
                  for (ResolveInfo r : list) {
                      String pkg = r.activityInfo.packageName;
                      if (pkg.equals(getPackageName()) || pkg.equals("com.android.settings") || pkg.equals("com.google.android.dialer") || pkg.equals("com.samsung.android.dialer") || !seen.add(pkg)) continue;
                      LinearLayout row = new LinearLayout(this);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(8), dp(8), dp(8), dp(8));
                      ImageView icon = new ImageView(this);
                      icon.setImageDrawable(r.loadIcon(pm));
                      row.addView(icon, new LinearLayout.LayoutParams(dp(42), dp(42)));
                      Switch sw = new Switch(this);
                      sw.setText("   " + r.loadLabel(pm));
                      sw.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                      sw.setTextColor(Color.parseColor("#1E293B"));
                      sw.setChecked(prefs.getBoolean("app_" + pkg, false));
                      row.addView(sw, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                      sw.setOnCheckedChangeListener((b, on) -> {
                          prefs.edit().putBoolean("app_" + pkg, on).apply();
                          LockService.unlocked.remove(pkg);
                      });
                      apps.addView(row);
                  }
              }

              private GradientDrawable makeRoundedBg(String fillHex, String strokeHex, int radiusDp, int strokeDp) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(fillHex));
                  gd.setCornerRadius(dp(radiusDp));
                  gd.setStroke(dp(strokeDp), Color.parseColor(strokeHex));
                  return gd;
              }

              private int dp(int val) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, val, getResources().getDisplayMetrics());
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mathlock/ChallengeActivity.java
          package com.example.mathlock;
          import android.animation.ObjectAnimator;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.*;
          import java.security.SecureRandom;

          public class ChallengeActivity extends Activity {
              private String target = "";
              private int correctAnswer = 0;
              private String currentInput = "";
              private boolean isSolved = false;
              private TextView mascotText, starsText, questionText, answerBox, feedbackText;
              private LinearLayout questionCard;
              private SharedPreferences prefs;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final SecureRandom random = new SecureRandom();
              private final String[] mascots = {
                      "🦁 Leo the Lion asks:",
                      "🐼 Penny Panda asks:",
                      "🦄 Sparkle Unicorn asks:",
                      "🐰 Benny Bunny asks:",
                      "🐸 Freddy Frog asks:",
                      "🐶 Buddy Puppy asks:"
              };

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  prefs = getSharedPreferences("lock", MODE_PRIVATE);
                  target = getIntent().getStringExtra("locked_package");
                  if (target == null || target.isEmpty()) target = LockService.currentTarget;
                  if (target == null) { finish(); return; }
                  buildKidsUI();
                  generateNewQuestion();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String pkg = intent.getStringExtra("locked_package");
                  if (pkg != null && !pkg.isEmpty()) target = pkg;
                  else if (LockService.currentTarget != null) target = LockService.currentTarget;
                  isSolved = false;
                  currentInput = "";
                  generateNewQuestion();
              }

              private void buildKidsUI() {
                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);
                  scrollView.setBackgroundColor(Color.parseColor("#FFF8E7"));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  int pad = dp(16);
                  root.setPadding(pad, dp(20), pad, pad);

                  starsText = new TextView(this);
                  starsText.setText("⭐ " + prefs.getInt("kids_stars", 0) + " Stars Won!");
                  starsText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                  starsText.setTypeface(Typeface.DEFAULT_BOLD);
                  starsText.setTextColor(Color.parseColor("#92400E"));
                  starsText.setPadding(dp(20), dp(8), dp(20), dp(8));
                  starsText.setBackground(makeRoundedBg("#FDE68A", "#F59E0B", 50, 3));
                  root.addView(starsText);

                  mascotText = new TextView(this);
                  mascotText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  mascotText.setTypeface(Typeface.DEFAULT_BOLD);
                  mascotText.setTextColor(Color.parseColor("#4F46E5"));
                  mascotText.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams mascotLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  mascotLp.topMargin = dp(12);
                  mascotLp.bottomMargin = dp(10);
                  root.addView(mascotText, mascotLp);

                  questionCard = new LinearLayout(this);
                  questionCard.setOrientation(LinearLayout.VERTICAL);
                  questionCard.setGravity(Gravity.CENTER);
                  questionCard.setPadding(dp(20), dp(18), dp(20), dp(18));
                  questionCard.setBackground(makeRoundedBg("#FFFFFF", "#A5B4FC", 32, 4));
                  LinearLayout.LayoutParams cardLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  cardLp.bottomMargin = dp(14);

                  questionText = new TextView(this);
                  questionText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 44);
                  questionText.setTypeface(Typeface.DEFAULT_BOLD);
                  questionText.setTextColor(Color.parseColor("#1E1B4B"));
                  questionText.setGravity(Gravity.CENTER);
                  questionCard.addView(questionText);

                  answerBox = new TextView(this);
                  answerBox.setText("?");
                  answerBox.setTextSize(TypedValue.COMPLEX_UNIT_SP, 38);
                  answerBox.setTypeface(Typeface.DEFAULT_BOLD);
                  answerBox.setTextColor(Color.parseColor("#4338CA"));
                  answerBox.setGravity(Gravity.CENTER);
                  answerBox.setMinimumWidth(dp(140));
                  answerBox.setPadding(dp(28), dp(8), dp(28), dp(8));
                  answerBox.setBackground(makeRoundedBg("#EEF2FF", "#818CF8", 24, 3));
                  LinearLayout.LayoutParams ansLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  ansLp.topMargin = dp(10);
                  questionCard.addView(answerBox, ansLp);

                  feedbackText = new TextView(this);
                  feedbackText.setText("Tap the right number! 👇");
                  feedbackText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17);
                  feedbackText.setTypeface(Typeface.DEFAULT_BOLD);
                  feedbackText.setTextColor(Color.parseColor("#6366F1"));
                  feedbackText.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams fbLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  fbLp.topMargin = dp(10);
                  questionCard.addView(feedbackText, fbLp);
                  root.addView(questionCard, cardLp);

                  GridLayout keypad = new GridLayout(this);
                  keypad.setColumnCount(3);
                  keypad.setRowCount(4);
                  LinearLayout.LayoutParams gridLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  gridLp.bottomMargin = dp(12);

                  String[] keys = {"1", "2", "3", "4", "5", "6", "7", "8", "9", "🧹", "0", "⌫"};
                  String[] bgColors = {"#FF6B6B", "#4ECDC4", "#FFD166", "#A78BFA", "#F472B6", "#38BDF8", "#34D399", "#FB923C", "#818CF8", "#EF4444", "#2DD4BF", "#F59E0B"};
                  String[] borderColors = {"#E11D48", "#0D9488", "#D97706", "#7C3AED", "#DB2777", "#0284C7", "#059669", "#EA580C", "#4F46E5", "#B91C1C", "#0F766E", "#B45309"};

                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button btn = new Button(this);
                      btn.setText(key);
                      btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 28);
                      btn.setTypeface(Typeface.DEFAULT_BOLD);
                      btn.setTextColor(Color.WHITE);
                      btn.setAllCaps(false);
                      btn.setBackground(makeRoundedBg(bgColors[i], borderColors[i], 24, 3));

                      GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                      params.width = 0;
                      params.height = dp(68);
                      params.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      params.setMargins(dp(6), dp(6), dp(6), dp(6));
                      btn.setLayoutParams(params);
                      btn.setOnClickListener(v -> { animateButtonBounce(v); onKeyTapped(key); });
                      keypad.addView(btn);
                  }
                  root.addView(keypad, gridLp);

                  Button homeBtn = new Button(this);
                  homeBtn.setText("🏠 Go Home");
                  homeBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  homeBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  homeBtn.setTextColor(Color.parseColor("#475569"));
                  homeBtn.setAllCaps(false);
                  homeBtn.setPadding(dp(24), dp(10), dp(24), dp(10));
                  homeBtn.setBackground(makeRoundedBg("#E2E8F0", "#CBD5E1", 50, 2));
                  homeBtn.setOnClickListener(v -> goHome());
                  root.addView(homeBtn);

                  scrollView.addView(root);
                  setContentView(scrollView);
              }

              private void generateNewQuestion() {
                  int minTable = Math.max(1, prefs.getInt("min", 1));
                  int maxTable = Math.max(minTable, Math.min(20, prefs.getInt("max", 5)));
                  int a = minTable + random.nextInt(maxTable - minTable + 1);
                  int b = 1 + random.nextInt(10);
                  correctAnswer = a * b;
                  mascotText.setText(mascots[random.nextInt(mascots.length)]);
                  questionText.setText(a + " × " + b + " = ?");
                  answerBox.setText("?");
                  answerBox.setTextColor(Color.parseColor("#4338CA"));
                  answerBox.setBackground(makeRoundedBg("#EEF2FF", "#818CF8", 24, 3));
                  feedbackText.setText("Tap the right number! 👇");
                  feedbackText.setTextColor(Color.parseColor("#6366F1"));
              }

              private void onKeyTapped(String key) {
                  if (isSolved) return;
                  if (key.equals("🧹")) { currentInput = ""; updateAnswerDisplay(); return; }
                  if (key.equals("⌫")) {
                      if (currentInput.length() > 0) {
                          currentInput = currentInput.substring(0, currentInput.length() - 1);
                          updateAnswerDisplay();
                      }
                      return;
                  }
                  String targetStr = String.valueOf(correctAnswer);
                  if (currentInput.length() >= targetStr.length()) return;
                  currentInput += key;
                  updateAnswerDisplay();
                  try {
                      int enteredVal = Integer.parseInt(currentInput);
                      if (enteredVal == correctAnswer) onCorrectAnswer();
                      else if (currentInput.length() >= targetStr.length()) onWrongAnswer();
                      else playFeedback(true, 30);
                  } catch (NumberFormatException ignored) {}
              }

              private void updateAnswerDisplay() {
                  if (currentInput.isEmpty()) {
                      answerBox.setText("?");
                      answerBox.setTextColor(Color.parseColor("#4338CA"));
                  } else {
                      answerBox.setText(currentInput);
                      answerBox.setTextColor(Color.parseColor("#1E1B4B"));
                  }
              }

              private void onCorrectAnswer() {
                  isSolved = true;
                  playFeedback(true, 120);
                  int newStars = prefs.getInt("kids_stars", 0) + 1;
                  prefs.edit().putInt("kids_stars", newStars).apply();
                  starsText.setText("⭐ " + newStars + " Stars Won!");
                  answerBox.setBackground(makeRoundedBg("#DCFCE7", "#22C55E", 24, 4));
                  answerBox.setTextColor(Color.parseColor("#15803D"));
                  feedbackText.setText("🎉 Yay! Great Job! ⭐");
                  feedbackText.setTextColor(Color.parseColor("#16A34A"));
                  if (target != null && !target.equals("preview")) {
                      int minutes = prefs.getInt("delay", 0);
                      LockService.unlocked.put(target, minutes == 0 ? Long.MAX_VALUE : SystemClock.elapsedRealtime() + minutes * 60000L);
                  }
                  LockService.challengeVisible = false;
                  handler.postDelayed(this::finish, 350);
              }

              private void onWrongAnswer() {
                  playFeedback(false, 200);
                  answerBox.setBackground(makeRoundedBg("#FEE2E2", "#EF4444", 24, 4));
                  answerBox.setTextColor(Color.parseColor("#B91C1C"));
                  feedbackText.setText("🙈 Oops! Try again!");
                  feedbackText.setTextColor(Color.parseColor("#DC2626"));
                  ObjectAnimator shake = ObjectAnimator.ofFloat(questionCard, "translationX", 0f, 18f, -18f, 12f, -12f, 0f);
                  shake.setDuration(400);
                  shake.start();
                  handler.postDelayed(() -> {
                      if (!isSolved) {
                          currentInput = "";
                          answerBox.setText("?");
                          answerBox.setTextColor(Color.parseColor("#4338CA"));
                          answerBox.setBackground(makeRoundedBg("#EEF2FF", "#818CF8", 24, 3));
                      }
                  }, 550);
              }

              private void animateButtonBounce(View v) {
                  ObjectAnimator.ofFloat(v, "scaleX", 1f, 0.88f, 1.05f, 1f).setDuration(180).start();
                  ObjectAnimator.ofFloat(v, "scaleY", 1f, 0.88f, 1.05f, 1f).setDuration(180).start();
              }

              private void playFeedback(boolean positive, int vibrateMs) {
                  try {
                      ToneGenerator tg = new ToneGenerator(AudioManager.STREAM_MUSIC, 80);
                      tg.startTone(positive ? ToneGenerator.TONE_PROP_ACK : ToneGenerator.TONE_PROP_NACK, 120);
                  } catch (Exception ignored) {}
                  try {
                      Vibrator vib = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vib != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vib.vibrate(VibrationEffect.createOneShot(vibrateMs, VibrationEffect.DEFAULT_AMPLITUDE));
                          else vib.vibrate(vibrateMs);
                      }
                  } catch (Exception ignored) {}
              }

              private GradientDrawable makeRoundedBg(String fillHex, String strokeHex, int radiusDp, int strokeDp) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(fillHex));
                  gd.setCornerRadius(dp(radiusDp));
                  gd.setStroke(dp(strokeDp), Color.parseColor(strokeHex));
                  return gd;
              }

              private int dp(int val) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, val, getResources().getDisplayMetrics());
              }

              private void goHome() {
                  if ("preview".equals(target)) { LockService.challengeVisible = false; finish(); return; }
                  Intent home = new Intent(Intent.ACTION_MAIN);
                  home.addCategory(Intent.CATEGORY_HOME);
                  home.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(home);
                  finish();
              }

              @Override public void onBackPressed() { goHome(); }
              @Override protected void onDestroy() { LockService.challengeVisible = false; super.onDestroy(); }
          }
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MathsAppLock-V3-BankSafe-Release
          path: app/build/outputs/apk/release/app-release.apk
