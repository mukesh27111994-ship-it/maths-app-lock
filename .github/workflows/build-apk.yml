name: Build Maths App Lock APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source code
        run: unzip -q Maths_App_Lock_V1_Source.zip

      - name: Build APK
        working-directory: MathsAppLock
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maths-App-Lock-APK
          path: MathsAppLock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
